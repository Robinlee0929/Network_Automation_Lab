<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Preview - Network Automation Lab Dashboard</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d8e0ec;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    main { max-width: 1080px; margin: 0 auto; padding: 28px 18px 48px; }
    nav { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 750;
      padding: 8px 10px;
      border-bottom: 2px solid transparent;
    }
    nav a.active { border-color: var(--accent); color: var(--accent); }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; }
    h2 { margin: 22px 0 10px; font-size: 18px; }
    p { margin: 0 0 18px; color: var(--muted); }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 10px 24px rgba(16, 24, 40, .07);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px; text-align: left; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    th { color: var(--muted); font-weight: 800; white-space: nowrap; }
    code, pre { font-family: Consolas, "Courier New", monospace; overflow-wrap: anywhere; }
    pre {
      background: #101828;
      color: #f8fafc;
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
      max-height: 560px;
      white-space: pre-wrap;
    }
    .badge {
      display: inline-block;
      min-width: 78px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef2f6;
      color: #475467;
      font-size: 12px;
      font-weight: 850;
      text-align: center;
    }
    a { color: #175cd3; }
  </style>
</head>
<body>
<main>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a class="active" href="{{ url_for('reports') }}">Reports</a>
    <a href="{{ url_for('commands') }}">Commands</a>
    <a href="{{ url_for('ai_intent_reviewer') }}">AI Intent Reviewer</a>
    <a href="{{ url_for('ai_checklist') }}">AI Checklist</a>
  </nav>
  <h1>JSON Preview</h1>
  <p><code>{{ report_path }}</code></p>
  <section>
    <h2>Summary</h2>
    <table>
      <tbody>
        <tr><th>Status</th><td><span class="badge">{{ preview.status }}</span></td></tr>
        {% for key, value in preview.summary.items() %}
        <tr><th>{{ key }}</th><td><code>{{ value }}</code></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
  {% if preview.pretty %}
  <section>
    <h2>Raw JSON</h2>
    <pre>{{ preview.pretty }}</pre>
  </section>
  {% endif %}
</main>
</body>
</html>
