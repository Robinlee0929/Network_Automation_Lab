name: Safe CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node and Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install committed Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint with zero warnings
        run: npm run lint

      - name: Run Node unit tests
        run: npm run test:unit

      - name: Build Next.js with telemetry disabled
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install committed Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest

      - name: Validate report index
        run: python network_lab.py --task report-index

      - name: Prove validation changed no tracked file
        run: git diff --exit-code
