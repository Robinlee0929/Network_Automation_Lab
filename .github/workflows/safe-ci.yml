name: Safe CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node and Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install committed Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint with zero warnings
        run: npm run lint

      - name: Run Node unit tests
        run: npm run test:unit

      - name: Build Next.js with telemetry disabled
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install committed Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest

      - name: Validate report index
        run: python network_lab.py --task report-index

      - name: Prove validation changed no tracked file
        run: git diff --exit-code
